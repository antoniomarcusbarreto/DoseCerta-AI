<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="DoseCerta">
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B4C5E"/>
      <stop offset="45%" stop-color="#6C8496"/>
      <stop offset="100%" stop-color="#C3D2D9"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#hero)"/>

  <!-- Arco: eco do medidor de doses restantes -->
  <path d="M 136 320 A 120 120 0 1 1 376 320"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.42"
        stroke-width="14" stroke-linecap="round"/>
  <path d="M 136 320 A 120 120 0 0 1 196 216"
        fill="none" stroke="#FFFFFF"
        stroke-width="14" stroke-linecap="round"/>

  <!-- Barras em fio de cabelo: eco do gráfico de adesão -->
  <g fill="#FFFFFF">
    <rect x="216" y="252" width="11" height="76" rx="5.5" opacity="0.55"/>
    <rect x="250" y="222" width="11" height="106" rx="5.5"/>
    <rect x="284" y="272" width="11" height="56" rx="5.5" opacity="0.55"/>
  </g>

  <circle cx="256" cy="378" r="13" fill="#FFFFFF"/>
</svg>
